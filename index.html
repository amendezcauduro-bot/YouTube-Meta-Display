<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>YouTube Meta Display</title>
<style>
:root{--bg:#050505;--panel:#111;--fg:#fff;--muted:#aaa;--accent:#ff2d2d;--line:#242424}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
.app{width:min(100vw,600px);min-height:100vh;margin:auto;padding:18px;display:flex;flex-direction:column;gap:12px;background:#050505}
.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:16px;font-weight:900;letter-spacing:.08em}.badge{font-size:11px;color:#ff7676}
.search{display:flex;gap:8px}.search input{flex:1;min-width:0;background:#111;border:1px solid var(--line);color:#fff;border-radius:14px;padding:13px;font-size:16px;outline:none}.search button{border:0;border-radius:14px;padding:0 16px;background:var(--accent);color:#fff;font-weight:900}
.status{font-size:12px;color:#9d9d9d;min-height:18px}.results{display:flex;flex-direction:column;gap:9px}.result{display:grid;grid-template-columns:120px 1fr;gap:11px;align-items:center;background:#0e0e0e;border:1px solid var(--line);border-radius:15px;padding:8px;cursor:pointer}.result img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:10px}.result h3{font-size:14px;line-height:1.25;margin:0 0 5px}.result p{font-size:11px;color:#999;margin:0;line-height:1.3}.result.selected{outline:2px solid var(--accent)}
.player{display:none;flex-direction:column;gap:10px}.player.active{display:flex}.playerbox{aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--line)}.playerbox iframe{width:100%;height:100%;border:0}.playerTitle{font-size:15px;font-weight:800;line-height:1.3}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.controls button{padding:12px;border-radius:13px;border:1px solid #2b2b2b;background:#111;color:#fff;font-weight:800}.hint{font-size:11px;color:#777;margin-top:auto;line-height:1.35}
</style>
</head>
<body>
<main class="app">
  <div class="top"><div class="brand">YOUTUBE HUD</div><div class="badge">META DISPLAY · V2</div></div>

  <form class="search" id="searchForm">
    <input id="query" type="search" placeholder="Busca: F1, box, música..." autocomplete="off" />
    <button type="submit">Buscar</button>
  </form>

  <div class="status" id="status">Escribe una búsqueda.</div>
  <section class="results" id="results"></section>

  <section class="player" id="player">
    <div class="playerbox" id="playerbox"></div>
    <div class="playerTitle" id="playerTitle"></div>
    <div class="controls">
      <button id="backBtn">← Resultados</button>
      <button id="reloadBtn">Recargar</button>
    </div>
  </section>

  <div class="hint">V2 usa YouTube Data API v3. No requiere iniciar sesión en Google. Algunos videos pueden impedir reproducción embebida.</div>
</main>

<script>
const YOUTUBE_API_KEY = "AIzaSyANWm6TYplmfQFHHL5vYRdQ1jSDv9Whhr0";
const form=document.getElementById('searchForm');
const query=document.getElementById('query');
const resultsEl=document.getElementById('results');
const statusEl=document.getElementById('status');
const player=document.getElementById('player');
const playerbox=document.getElementById('playerbox');
const playerTitle=document.getElementById('playerTitle');
let currentResults=[];
let selectedIndex=0;
let currentVideo=null;

function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}

async function searchYouTube(term){
  statusEl.textContent='Buscando…';
  resultsEl.innerHTML='';
  player.classList.remove('active');
  try{
    const params=new URLSearchParams({
      part:'snippet',
      type:'video',
      maxResults:'5',
      q:term,
      safeSearch:'moderate',
      videoEmbeddable:'true',
      key:YOUTUBE_API_KEY
    });
    const r=await fetch('https://www.googleapis.com/youtube/v3/search?'+params.toString());
    const data=await r.json();
    if(!r.ok){throw new Error(data?.error?.message || 'Error de YouTube API');}
    currentResults=(data.items||[]).map(item=>({
      id:item.id.videoId,
      title:item.snippet.title,
      channel:item.snippet.channelTitle,
      thumb:item.snippet.thumbnails?.medium?.url || item.snippet.thumbnails?.default?.url || ''
    }));
    selectedIndex=0;
    renderResults();
    statusEl.textContent=currentResults.length?`${currentResults.length} resultados`:'No encontré resultados.';
  }catch(err){
    statusEl.textContent='Error: '+err.message;
  }
}

function renderResults(){
  resultsEl.innerHTML=currentResults.map((v,i)=>`
    <article class="result ${i===selectedIndex?'selected':''}" data-i="${i}">
      <img src="${esc(v.thumb)}" alt="" />
      <div><h3>${esc(v.title)}</h3><p>${esc(v.channel)}</p></div>
    </article>`).join('');
  [...resultsEl.querySelectorAll('.result')].forEach(el=>{
    el.addEventListener('click',()=>openVideo(Number(el.dataset.i)));
  });
}

function openVideo(i){
  const v=currentResults[i]; if(!v)return;
  currentVideo=v;
  playerTitle.textContent=v.title;
  playerbox.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.id)}?autoplay=1&playsinline=1&rel=0" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
  resultsEl.innerHTML='';
  player.classList.add('active');
  statusEl.textContent=v.channel;
}

form.addEventListener('submit',e=>{
  e.preventDefault();
  const term=query.value.trim();
  if(term) searchYouTube(term);
});

document.getElementById('backBtn').onclick=()=>{
  player.classList.remove('active');
  playerbox.innerHTML='';
  renderResults();
  statusEl.textContent=currentResults.length?`${currentResults.length} resultados`:'Escribe una búsqueda.';
};

document.getElementById('reloadBtn').onclick=()=>{
  if(currentVideo) openVideo(currentResults.findIndex(v=>v.id===currentVideo.id));
};

// Teclado: útil para probar en navegador. Después podemos mapear estos eventos a Neural Band.
document.addEventListener('keydown',e=>{
  if(player.classList.contains('active')){
    if(e.key==='Escape' || e.key==='ArrowLeft') document.getElementById('backBtn').click();
    return;
  }
  if(!currentResults.length)return;
  if(e.key==='ArrowDown'){selectedIndex=Math.min(currentResults.length-1,selectedIndex+1);renderResults();}
  if(e.key==='ArrowUp'){selectedIndex=Math.max(0,selectedIndex-1);renderResults();}
  if(e.key==='Enter' && document.activeElement!==query) openVideo(selectedIndex);
});
</script>
</body>
</html>
